name: Unit Tests & Build

on:
  push:
    branches: [ main, develop, master, beta-* ]
  pull_request:
    branches: [ main, develop, master, beta-* ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Run Unit Tests (Native Platform)
      run: pio test -e native -vv

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build for Teensy 4.1
      run: pio run -e teensy41

    - name: Upload Firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/teensy41/firmware.hex
